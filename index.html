<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test01">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%81%3C/text%3E%3C/svg%3E">
<title>Test01</title>
<style>
:root{--bg:#0f1218;--s:#171b23;--s2:#1f242e;--bd:#252b36;--tx:#e8eaef;--mu:#8b93a3;--ac:#7aa2ff;--ac2:rgba(122,162,255,.14);--fo:#f0b560;--ok:#3ecf8e;--er:#f4605a;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--s:#fff;--s2:#eef0f5;--bd:#e4e7ee;--tx:#151821;--mu:#6a7282;--ac:#3b6df0;--ac2:rgba(59,109,240,.1);--fo:#d4881a;--ok:#1fa971;--er:#d93a34;color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

#app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.top{display:flex;align-items:center;gap:6px;padding:14px 12px 8px 16px;min-height:64px}
.ttl{flex:1;min-width:0}
h1{font-size:22px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12.5px;color:var(--mu)}
.btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--mu);cursor:pointer;flex:none;transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--s2);color:var(--tx)}
.btn:active{transform:scale(.92)}
#back{margin-left:-8px;color:var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;margin-right:2px;transition:background .2s}
.dot.err{background:var(--er)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.srch{position:relative;margin:4px 12px 6px}
.srch svg{position:absolute;left:13px;top:50%;margin-top:-10px;color:var(--mu);pointer-events:none}
#q{width:100%;height:44px;padding:0 14px 0 42px;border-radius:14px;border:1px solid var(--bd);background:var(--s);outline:none;-webkit-appearance:none;appearance:none;user-select:text;-webkit-user-select:text;transition:border-color .15s,box-shadow .15s}
#q::placeholder{color:var(--mu)}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}

.crumbs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 16px;font-size:13.5px;white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumbs a{color:var(--mu);padding:3px 6px;border-radius:8px}
.crumbs a:hover{color:var(--ac);background:var(--ac2)}
.crumbs i{color:var(--bd);font-style:normal}
.crumbs .cur{font-weight:600;padding:3px 6px}

.msg{margin:2px 12px 6px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--er) 12%,transparent);color:var(--er);font-size:13px}

.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.acts{display:flex;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;border-radius:999px;background:var(--s);border:1px solid var(--bd);font-size:13.5px;font-weight:500;transition:border-color .15s,color .15s,transform .1s}
.pill svg{width:17px;height:17px;color:var(--ac)}
.pill:hover{border-color:var(--ac)}
.pill:active{transform:scale(.96)}

.list{background:var(--s);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;border-top:1px solid var(--bd);transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--s2)}
.row:active{background:var(--ac2)}
.main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--s2);color:var(--mu);flex:none}
.row:hover .ic{background:var(--bg)}
.ic.fo{color:var(--fo);background:color-mix(in srgb,var(--fo) 15%,transparent)}
.ic.ht{color:var(--ac);background:var(--ac2)}
.tx{flex:1;min-width:0}
.nm,.meta{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-weight:500}
.meta{font-size:12.5px;color:var(--mu)}
.chev{color:var(--mu);opacity:.6;width:18px;height:18px}
.act{width:38px;height:38px;margin-right:10px;border-radius:11px;display:grid;place-items:center;color:var(--ac);flex:none;transition:background .15s}
.act:hover{background:var(--ac2)}

.sk{height:58px;border-top:1px solid var(--bd);position:relative;overflow:hidden}
.sk:first-child{border-top:0}
.sk::after{content:"";position:absolute;inset:14px 14px;border-radius:10px;background:linear-gradient(90deg,var(--s2),var(--bd),var(--s2));background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;opacity:.6}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

.empty{padding:48px 24px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-weight:600;margin-bottom:4px}
.empty a,.empty button{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;color:var(--ac);font-weight:500}

@media(min-width:800px){
  #app{padding-top:28px}
  .scroll{padding-bottom:32px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="btn" id="back" aria-label="Go up one level" hidden></button>
    <div class="ttl"><h1 id="title">Test01</h1><div id="sub"></div></div>
    <span class="dot" id="dot" title="Connected"></span>
    <button class="btn" id="ref" aria-label="Refresh" title="Refresh"></button>
  </header>
  <div class="srch"><span id="si"></span><input id="q" type="search" placeholder="Search files and folders" aria-label="Search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
  <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
  <div class="msg" id="msg" hidden></div>
  <main class="scroll" id="scroll">
    <div class="acts" id="acts"></div>
    <div class="list" id="list"></div>
  </main>
</div>
<script>
(()=>{
const O="mamad7202202",R="Test01",B="main";
const P=`https://${O}.github.io/${R}`,G=`https://github.com/${O}/${R}`,
A=`https://api.github.com/repos/${O}/${R}/git/trees/${B}?recursive=1`,KEY=`tree:${O}/${R}`;
const $=s=>document.querySelector(s);
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
const I={
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
back:'<path d="M15 18l-6-6 6-6"/>',
chev:'<path d="M9 6l6 6-6 6"/>',
ref:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'};
const svg=(n,c)=>`<svg viewBox="0 0 24 24" aria-hidden="true"${c?` class="${c}"`:""}>${I[n]}</svg>`;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ic=(n,c)=>{const s=el("span","ic "+(c||""));s.innerHTML=svg(n);return s};
const fmt=b=>b==null?"":b<1024?b+" B":b<1048576?(b/1024).toFixed(b<10240?1:0)+" KB":(b/1048576).toFixed(1)+" MB";
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const sortFn=(a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name,undefined,{numeric:true});

let items=[],kids=new Map(),paths=new Set(),sha=null,q="",cur="",ready=false,failed=false,busy=false,shown=null;

function build(tree){
  items=tree.map(t=>({path:t.path,name:t.path.slice(t.path.lastIndexOf("/")+1),dir:t.type==="tree",size:t.size}));
  kids=new Map([["",[]]]);paths=new Set();
  for(const i of items){paths.add(i.path);if(i.dir)kids.set(i.path,[])}
  for(const i of items){const k=i.path.lastIndexOf("/"),p=k<0?"":i.path.slice(0,k);if(!kids.has(p))kids.set(p,[]);kids.get(p).push(i)}
  ready=true;failed=false;
}
const has=p=>paths.has(p?p+"/index.html":"index.html");
const isHtml=n=>/\.html?$/i.test(n);

function pill(href,icon,text){
  const a=el("a","pill");a.href=href;a.target="_blank";a.rel="noopener";
  a.innerHTML=svg(icon);a.append(text);return a;
}

function render(){
  const list=$("#list"),acts=$("#acts"),crumbs=$("#crumbs");
  list.replaceChildren();acts.replaceChildren();crumbs.replaceChildren();
  $("#title").textContent=q?"Search":(cur?cur.slice(cur.lastIndexOf("/")+1):R);
  $("#back").hidden=!cur||!!q;
  crumbs.hidden=!!q;acts.hidden=!!q;

  if(!ready){
    $("#sub").textContent=failed?"Not loaded":"Loading…";
    if(failed){
      const e=el("div","empty");e.append(el("b",null,"Couldn’t load the repository"),"Check your connection or the API limit, then try again.");
      const b=el("button",null,"Try again");b.onclick=()=>load();e.append(el("br"),b);list.append(e);
    }else for(let i=0;i<7;i++)list.append(el("div","sk"));
    return;
  }

  if(!q){
    const segs=cur?cur.split("/"):[];
    const mk=(t,h,last)=>{const e=last?el("span","cur",t):el("a",null,t);if(!last)e.href=h;return e};
    crumbs.append(mk(R,"#/",!segs.length));
    segs.forEach((s,i)=>crumbs.append(el("i",null,"/"),mk(s,"#/"+enc(segs.slice(0,i+1).join("/")),i===segs.length-1)));
    crumbs.scrollLeft=crumbs.scrollWidth;
    acts.append(pill(cur?`${G}/tree/${B}/${enc(cur)}`:G,"ext","GitHub"));
    if(cur&&has(cur))acts.append(pill(`${P}/${enc(cur)}/`,"globe","Website"));
  }

  if(!q&&cur&&!kids.has(cur)){
    $("#sub").textContent="";acts.hidden=true;
    const e=el("div","empty");e.append(el("b",null,"Folder not found"),"It may have been moved or deleted.");
    const a=el("a",null,"Go to start");a.href="#/";e.append(el("br"),a);list.append(e);return;
  }

  const rows=(q?items.filter(i=>i.path.toLowerCase().includes(q)).sort(sortFn).slice(0,300):kids.get(cur).slice().sort(sortFn));
  $("#sub").textContent=q?plural(rows.length,"result"):plural(rows.length,"item");

  if(!rows.length){
    const e=el("div","empty");e.append(el("b",null,q?"No matches":"This folder is empty"),q?"Try a different name.":"Nothing to show here yet.");
    list.append(e);return;
  }

  const frag=document.createDocumentFragment();
  for(const n of rows){
    const html=!n.dir&&isHtml(n.name);
    const row=el("div","row"),a=el("a","main");
    a.href=n.dir?"#/"+enc(n.path):`${G}/blob/${B}/${enc(n.path)}`;
    if(!n.dir){a.target="_blank";a.rel="noopener"}
    const tx=el("span","tx");
    let meta=n.dir?plural((kids.get(n.path)||[]).length,"item"):fmt(n.size);
    if(q){const k=n.path.lastIndexOf("/");meta=(k<0?"/":n.path.slice(0,k))+"  ·  "+meta}
    tx.append(el("span","nm",n.name),el("span","meta",meta));
    a.append(ic(n.dir?"folder":"file",n.dir?"fo":html?"ht":""),tx);
    if(n.dir){const c=el("span");c.innerHTML=svg("chev","chev");a.append(c.firstChild)}
    row.append(a);
    const web=n.dir?(has(n.path)?`${P}/${enc(n.path)}/`:null):(html?`${P}/${enc(n.path)}`:null);
    if(web){
      const w=el("a","act");w.href=web;w.target="_blank";w.rel="noopener";
      w.title="Open website";w.setAttribute("aria-label","Open "+n.name+" as website");w.innerHTML=svg("globe");row.append(w);
    }
    frag.append(row);
  }
  list.append(frag);
}

function route(){
  let h=location.hash.replace(/^#\/?/,"");
  try{h=decodeURIComponent(h)}catch(e){}
  const next=h.replace(/\/+$/,"");
  if(q){q="";$("#q").value=""}
  if(next!==cur||shown===null)$("#scroll").scrollTop=0;
  cur=next;shown=cur;render();
}

function setMsg(t){const m=$("#msg");m.hidden=!t;m.textContent=t||""}

async function load(){
  if(busy)return;busy=true;$("#ref").classList.add("spin");
  try{
    const r=await fetch(A,{cache:"no-cache",headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok)throw new Error(r.status===403||r.status===429?"GitHub API limit reached, try again later":"Server error ("+r.status+")");
    const d=await r.json();
    $("#dot").classList.remove("err");$("#dot").title="Connected";
    setMsg(d.truncated?"This repository is large, so the list is incomplete.":"");
    if(d.sha!==sha||!ready){
      sha=d.sha;build(d.tree);render();
      try{localStorage.setItem(KEY,JSON.stringify({sha,tree:d.tree}))}catch(e){}
    }
  }catch(e){
    $("#dot").classList.add("err");$("#dot").title=e.message;
    const msg=navigator.onLine===false?"You’re offline":e.message;
    if(ready)setMsg(msg+". Showing saved data.");
    else{failed=true;setMsg(msg);render()}
  }finally{busy=false;$("#ref").classList.remove("spin")}
}

// init
$("#back").innerHTML=svg("back");
$("#ref").innerHTML=svg("ref");
$("#si").innerHTML=svg("search");
$("#back").onclick=()=>{const k=cur.lastIndexOf("/");location.hash="#/"+(k<0?"":enc(cur.slice(0,k)))};
$("#ref").onclick=()=>load();
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();$("#scroll").scrollTop=0;render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";q="";render();e.target.blur()}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
});
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
window.addEventListener("online",()=>load());
setInterval(()=>{if(!document.hidden)load()},120000);

try{ // installable manifest (best effort)
  const m={name:"Test01",short_name:"Test01",display:"standalone",start_url:location.href.split("#")[0],background_color:"#0f1218",theme_color:"#0f1218"};
  const l=el("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.append(l);
}catch(e){}

try{ // instant start from cache
  const c=JSON.parse(localStorage.getItem(KEY)||"null");
  if(c&&c.tree){sha=c.sha;build(c.tree)}
}catch(e){}
route();load();
})();
</script>
</body>
</html>
