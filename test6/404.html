<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page not found — Dragon Agent Mobile</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dragon-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}</script>
<style>
:root{color-scheme:light dark;--bg:#f8f6f1;--surface:#fffefa;--ink:#24231f;--muted:#67655f;--line:#dedbd2;--accent:#b94324;--button-text:#fffaf6;--focus:#164f91}html[data-theme=dark]{--bg:#171615;--surface:#201f1c;--ink:#f1efe8;--muted:#b8b4ab;--line:#3b3933;--accent:#ff8a5d;--button-text:#281610;--focus:#ffd079}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'DM Sans','Vazirmatn','Segoe UI',sans-serif;transition:opacity 180ms ease-out;-webkit-tap-highlight-color:transparent}main{max-width:720px;margin:12vh auto;padding:30px}.eyebrow{font:600 .75rem 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--accent);margin:70px 0 12px}h1{font-size:clamp(2.5rem,7vw,4.3rem);letter-spacing:-.05em;line-height:1.08;margin:0 0 16px}p{color:var(--muted);max-width:560px}.row{display:flex;align-items:center;justify-content:space-between}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}a,button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:999px;font:inherit;font-size:.92rem;font-weight:600;text-decoration:none;touch-action:manipulation;user-select:none}a.primary{background:var(--accent);color:var(--button-text)}a.secondary,button{border:1px solid var(--line);background:var(--surface);color:var(--ink)}button{cursor:pointer}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script defer>
(()=>{const parts=location.pathname.split('/').filter(Boolean);let langIndex=-1;for(let i=parts.length-1;i>=0;i--)if(parts[i]==='en'||parts[i]==='fa'){langIndex=i;break}const root=langIndex>=0?'/'+parts.slice(0,langIndex).join('/')+'/':'/'+parts.slice(0,-1).join('/')+'/';document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#en').href=root+'en/';document.querySelector('#fa').href=root+'fa/';document.querySelector('#theme').addEventListener('click',()=>{const mode=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=mode;try{localStorage.setItem('dragon-theme',mode)}catch{}})})})();
</script>
</head>
<body><main><div class="row"><span dir="ltr"><strong>Dragon Agent</strong> Mobile</span><button id="theme" type="button" aria-label="Toggle theme">Theme</button></div><p class="eyebrow">404 / NOT FOUND</p><h1>This page is missing.</h1><p>The address may have changed. Return to the project home or choose a language.</p><nav class="links" aria-label="Language home links"><a class="primary" id="en" href="en/">English home</a><a class="secondary" id="fa" href="fa/" lang="fa" dir="rtl">صفحهٔ فارسی</a></nav></main></body></html>
